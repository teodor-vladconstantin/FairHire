services:
  proof-server:
    image: midnightntwrk/proof-server:8.1.0
    container_name: midnight-proof-server
    ports:
      - "6300:6300"
    command: ["midnight-proof-server", "-v"]
    restart: unless-stopped
    # No container-level healthcheck: the midnightntwrk/proof-server image is
    # a minimal/distroless image with no shell or curl, so a `docker` exec-
    # based healthcheck can't run inside it and would always report
    # "unhealthy" despite the server working fine. Readiness is checked from
    # the host instead — `curl http://localhost:6300/health`, or the app's
    # own checkProofServerHealth() in src/lib/midnight.ts.
